services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: ai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:change-me@postgres:5432/ai
      TEST_DATABASE_URL: postgresql+asyncpg://app:change-me@postgres:5432/ai_test
      JWT_SECRET: change-me-to-a-long-random-string
      MODEL_PROVIDER: mock
      QUOTA_LIMIT: "100"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
volumes:
  pgdata:
